
workflows:
  android-debug-build:
    name: DocScanner Debug Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      java: 17
      groups:
        # Create this group in Codemagic's UI (Environment variables) if you
        # later add signing secrets, API keys, etc. Safe to leave empty for now.
        - docscanner_env
      vars:
        PACKAGE_NAME: "com.docscanner.app"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'master'
          include: true
        - pattern: 'main'
          include: true

    scripts:
      - name: Set execute permission for gradlew
        script: chmod +x ./gradlew

      - name: Build debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
